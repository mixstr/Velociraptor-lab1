name: Custom.Lab.OutboundAnomaly
description: |
  Правило 3 (outbound-anomaly). Ищет УСТАНОВЛЕННЫЕ исходящие TCP-соединения
  на нестандартные порты. Источник — WMI-класс MSFT_NetTCPConnection
  (ROOT\StandardCimv2), процесс-владелец определяется через pslist().
  Разрешённые порты задаются регулярным выражением AllowedPorts
  (8000 — frontend Velociraptor). Это точечная проверка состояния,
  а не непрерывный мониторинг.
author: Соколов С.А., КТ-23-04
type: CLIENT
parameters:
  - name: AllowedPorts
    type: regex
    default: '^(53|80|443|8000|135|139|445|3389)$'
    description: Порты назначения, которые считаются нормальными.
  - name: IgnoreRemoteRegex
    type: regex
    default: '^(127\.|::1|0\.0\.0\.0)'
    description: Удалённые адреса, которые не проверяются (loopback).
sources:
  - name: SuspiciousOutbound
    precondition: SELECT OS FROM info() WHERE OS = 'windows'
    query: |
      -- State 5 = Established (тип uint8 приводим к строке)
      LET Conns = SELECT LocalAddress, LocalPort, RemoteAddress, RemotePort,
             State, OwningProcess
        FROM wmi(namespace="ROOT\\StandardCimv2",
                 query="SELECT LocalAddress, LocalPort, RemoteAddress, RemotePort, State, OwningProcess FROM MSFT_NetTCPConnection")
        WHERE str(str=State) =~ '^(5|Established)$'
          AND NOT RemoteAddress =~ IgnoreRemoteRegex
          AND NOT str(str=RemotePort) =~ AllowedPorts

      SELECT timestamp(epoch=now()) AS DetectedAt,
             LocalAddress, LocalPort, RemoteAddress, RemotePort,
             str(str=State) AS State, OwningProcess AS Pid,
             { SELECT Name FROM pslist(pid=int(int=OwningProcess)) } AS ProcessName,
             { SELECT CommandLine FROM pslist(pid=int(int=OwningProcess)) } AS CommandLine,
             "outbound_nonstandard_port" AS DetectionReason
      FROM Conns
